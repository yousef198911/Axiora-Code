name: Build Axiora-Code (Windows x64)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      VSCODE_ARCH: x64
      SHOULD_BUILD_MSI: "no"
      SHOULD_BUILD_MSI_NOUP: "no"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      MAX_OLD_SPACE_SIZE: "12288"
      ComSpec: 'C:\Windows\system32\cmd.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Tools
        run: |
          choco install -y jq innosetup 7zip || true
          ST=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          ls "$ST/signtool.exe"
          # Copy signtool dir to a path without "(x86)"/spaces; "(x86)" PATH entries broke cmd.exe
          mkdir -p /c/axtools && cp -r "$ST" /c/axtools/signtool
          ls /c/axtools/signtool/signtool.exe
          echo "AXIORA_SIGNTOOL_DIR=/c/axtools/signtool" >> $GITHUB_ENV
          echo "AXIORA_ISCC=/c/Program Files (x86)/Inno Setup 6/ISCC.exe" >> $GITHUB_ENV
      - name: Check cmd.exe can run npm (fail fast)
        run: |
          cmd //c "npm -v"
          cmd //c "where npm"
      - name: Increase pagefile
        shell: pwsh
        run: |
          Get-CimInstance Win32_PageFileUsage | Format-List
      - name: Build (compile + package + installers)
        run: |
          # bash-only PATH addition for signtool.exe (spawned by build scripts)
          export PATH="$PATH:$AXIORA_SIGNTOOL_DIR"
          ./dev/build.sh -p
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find assets VSCode-win32-x64 build/windows -maxdepth 3 \( -name '*.exe' -o -name '*.zip' -o -name '*.msi' \) 2>/dev/null | grep -v node_modules | xargs -I{} cp {} dist/ || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Axiora-Code-win32-x64
          path: dist/*
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
